name: JavaScript checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Syntax and regression checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            echo "Checking $file"
            node --check "$file"
          done < <(find SHTAB-95/js SHTAB-95/locales -type f -name '*.js' -print0)
      - name: Run project checks
        run: |
          node --test tests/*.test.mjs
          node --test SHTAB-95/tests/i18n.test.js
      - name: Audit experimental lake routing on generated terrain
        run: |
          for region in donja_bukovica popovac lipovac mckhetovac; do
            node tests/hydrology-region-audit.mjs "$region" 42 32
          done
          node tests/hydrology-region-audit.mjs mckhetovac 4294967295 32
          node tests/hydrology-region-audit.mjs donja_bukovica 501738173 32
      - name: Verify full-resolution terrain seed matrix
        run: node tests/terrain-worker-matrix.mjs
