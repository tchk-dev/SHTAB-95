name: Publish playable builds

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, feature/doors95-pseudonet-browser]
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to publish (leave empty for stable)'
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: pages-publish
  cancel-in-progress: false

jobs:
  publish:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the game version
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.pr_number != '' && format('refs/pull/{0}/head', inputs.pr_number) || github.sha }}
      - name: Prepare published files
        shell: bash
        run: |
          mkdir -p public
          cp -a SHTAB-95/. public/
          touch public/.nojekyll
      - name: Publish stable or PR preview
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_DIR: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.event_name == 'workflow_dispatch' && inputs.pr_number != '' && format('pr-{0}', inputs.pr_number) || 'stable' }}
        shell: bash
        run: |
          set -euo pipefail
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git clone --branch gh-pages --single-branch "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" pages
          mkdir -p "pages/${TARGET_DIR}"
          find "pages/${TARGET_DIR}" -mindepth 1 -maxdepth 1 -exec rm -rf {} +
          cp -a public/. "pages/${TARGET_DIR}/"
          touch pages/.nojekyll
          cd pages
          git add -A
          if git diff --cached --quiet; then
            echo "Published content unchanged"
          else
            git commit -m "Publish ${TARGET_DIR} from ${GITHUB_SHA}"
            git push origin gh-pages
          fi
